spring:
  application:
    name: project-management-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/project_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:pm_user}
    password: ${DB_PASSWORD:pm_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp:
        auth: ${SMTP_AUTH:false}
        starttls.enable: ${SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

app:
  security:
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  intake:
    enabled: ${INTAKE_ENABLED:false}
    token: ${INTAKE_TOKEN:}
  storage:
    type: ${FILE_STORAGE_TYPE:local}
    path: ${FILE_STORAGE_PATH:./data/files}
    http:
      base-url: ${FILE_STORAGE_HTTP_BASE_URL:http://localhost:9000/files}
      bearer-token: ${FILE_STORAGE_HTTP_BEARER_TOKEN:}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123456}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
  notifications:
    dispatch-interval-ms: ${NOTIFICATION_DISPATCH_INTERVAL_MS:30000}
    email:
      enabled: ${EMAIL_ENABLED:false}
      from: ${EMAIL_FROM:}
    wechat:
      webhook-url: ${WECHAT_WEBHOOK_URL:}
    teams:
      webhook-url: ${TEAMS_WEBHOOK_URL:}
  sso:
    enabled: ${SSO_ENABLED:false}
    registration-id: ${SSO_REGISTRATION_ID:corporate}
    username-claim: ${SSO_USERNAME_CLAIM:preferred_username}

management:
  health:
    mail:
      enabled: ${EMAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
